name: fitness_tracker
description: A local-first fitness tracking app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3+1      # local SQLite persistence (real CRUD, survives restarts)
  path: ^1.9.0            # resolving the on-device database file path
  provider: ^6.1.2         # single, consistent state-management approach
  intl: ^0.19.0            # date/time formatting for history & charts
  sqflite_common_ffi: ^2.3.4  # required at runtime on desktop (Windows/Linux/macOS),
                               # where the sqflite plugin has no native implementation
                               # and never auto-registers a databaseFactory

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
